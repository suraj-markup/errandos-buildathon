services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: errandos
      POSTGRES_PASSWORD: errandos
      POSTGRES_DB: errandos_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U errandos -d errandos_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
